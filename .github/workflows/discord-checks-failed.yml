name: Discord check failures

# Posts to Discord when "Next.js checks" fails on a pull request.
# It runs after that workflow finishes, in this repo's own context, so it can read the
# webhook secret. It never checks out or runs the pull request's code, so it is safe
# for pull requests from forks.
on:
  workflow_run:
    workflows:
      - Next.js checks
    types:
      - completed

permissions: {}

jobs:
  notify-discord:
    # Only failures. Dependabot's runs are skipped: they can't read the webhook secret.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send failure notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # For pull request runs, display_title is the PR title.
          PR_TITLE: ${{ github.event.workflow_run.display_title }}
          # Empty for pull requests from forks; the message then shows the branch instead.
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          AUTHOR: ${{ github.event.workflow_run.actor.login }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            HEADING="❌ Checks failed on PR #$PR_NUMBER: $PR_TITLE"
          else
            HEADING="❌ Checks failed: $PR_TITLE"
          fi

          jq -n \
            --arg title "$HEADING" \
            --arg url "$RUN_URL" \
            --arg author "$AUTHOR" \
            --arg branch "$BRANCH" \
            --arg repo "$REPOSITORY" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: ("**Repository:** " + $repo + "\n**Author:** " + $author + "\n**Branch:** " + $branch + "\nLint, type-check or build failed. Open the run to see which step."),
                color: 15548997
              }],
              allowed_mentions: {parse: []}
            }' |
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d @- \
            "$DISCORD_WEBHOOK_URL"
